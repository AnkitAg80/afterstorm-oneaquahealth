name: Tests

on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and cache tests (mocked, offline)
        run: python test_fetch.py
      - name: Planning and FHIR checks (committed cache, offline)
        run: python test_plan.py
      - name: Browser-generated lab sheet fixture
        run: python test_labsheet.py
